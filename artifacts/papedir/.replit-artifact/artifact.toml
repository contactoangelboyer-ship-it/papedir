kind = "web"
previewPath = "/"
title = "Pa'pedir"
version = "1.0.0"
id = "artifacts/papedir"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 20774

[services.development]
run = "pnpm --filter @workspace/papedir run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/papedir", "run", "build" ]
publicDir = "artifacts/papedir/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "20774"
BASE_PATH = "/"
